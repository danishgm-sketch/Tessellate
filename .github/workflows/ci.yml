name: CI

on:
  push:
    branches: [main, 'antigravity/*']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate catalogue & schemas
        run: pnpm build:catalog

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Licence & provenance audit
        run: tsx scripts/audit-license-provenance.ts

      - name: Secret & security audit
        run: tsx scripts/audit-security-secrets.ts

      - name: Vitest (unit & integration)
        run: pnpm test

      - name: Behavioural release gate
        run: pnpm audit:release-gate

      - name: Production build
        run: pnpm build

      - name: Bundle budget audit
        run: tsx scripts/audit-bundle-budgets.ts

      - name: Playwright E2E & Axe accessibility tests
        run: pnpm test:e2e
