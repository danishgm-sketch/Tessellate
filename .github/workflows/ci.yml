name: CI

on:
  push:
    branches: [main, 'antigravity/*', 'codex/*', 'consolidation/product-hardening']
  pull_request:
    branches: [main, 'consolidation/product-hardening']

jobs:
  windows-host-secret-acl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify legacy laptop secret ACLs are restricted
        shell: pwsh
        run: ./scripts/tests/Test-LaptopSecretAcl.ps1

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: 'pnpm'

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate catalogue & schemas
        run: pnpm build:catalog

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Vitest (unit & integration)
        run: pnpm test

      - name: Complete audits with fresh build prerequisites
        run: pnpm audit:all

      - name: Production build
        run: pnpm build

      - name: Bundle budget audit
        run: pnpm audit:budgets

      - name: Playwright E2E & Axe accessibility tests
        run: pnpm test:e2e
